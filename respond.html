<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설문 응답</title>
<style>
:root{--bg:#f3f6f8;--fg:#14232e;--card:#fff;--ac:#0f766e;--mu:#5b6b76;--bd:#d5dde3}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--fg:#e6eef2;--card:#17252e;--ac:#5eead4;--mu:#93a5b0;--bd:#2c3e49}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:640px;margin:auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.q{border-top:1px solid var(--bd);padding-top:12px;margin-top:14px}
.opt{display:flex;gap:8px;align-items:center;padding:5px 0}
.opt input{width:auto;margin:0}
textarea{width:100%;min-height:80px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-top:6px}
button{font:inherit;background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:16px}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
</style>
</head>
<body>
<main id="m"><p class="mu">불러오는 중…</p></main>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('s');
const H={apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'};
let sv;
const msg=t=>$('#m').innerHTML=`<div class="card">${t}</div>`;

(async()=>{
  try{
    if(!id)throw 0;
    if(localStorage.getItem('done_'+id))return msg('이미 응답해 주셨습니다. 참여해 주셔서 감사합니다.');
    const r=await fetch(`${CFG.url}/rest/v1/surveys?id=eq.${encodeURIComponent(id)}&select=title,questions`,{headers:H});
    sv=(await r.json())[0];if(!sv)throw 0;draw();
  }catch(e){msg('열려 있는 설문이 아니거나 링크가 올바르지 않습니다.')}
})();

function draw(){
  $('#m').innerHTML=`<div class="card"><h1>${esc(sv.title)}</h1>${sv.questions.map((q,i)=>{
    const n='q_'+q.id;let f='';
    if(q.type==='text')f=`<textarea name="${n}" aria-label="답변"></textarea>`;
    else if(q.type==='scale')f='<div class="mu">1 = 전혀 아니다 · 5 = 매우 그렇다</div>'+[1,2,3,4,5].map(v=>`<label class="opt"><input type="radio" name="${n}" value="${v}">${v}</label>`).join('');
    else f=q.options.map(o=>`<label class="opt"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${n}" value="${esc(o)}">${esc(o)}</label>`).join('');
    return `<div class="q"><div>${i+1}. ${esc(q.text)}</div>${f}</div>`}).join('')}
  <button id="go" onclick="send()">제출</button></div>`;
}

async function send(){
  const a={};
  sv.questions.forEach(q=>{const els=[...document.getElementsByName('q_'+q.id)];
    if(q.type==='multi')a[q.id]=els.filter(e=>e.checked).map(e=>e.value);
    else if(q.type==='text')a[q.id]=els[0].value.trim();
    else{const c=els.find(e=>e.checked);a[q.id]=c?(q.type==='scale'?+c.value:c.value):null}});
  $('#go').disabled=true;
  try{
    const r=await fetch(CFG.url+'/rest/v1/responses',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({survey_id:id,answers:a})});
    if(!r.ok)throw new Error(await r.text());
    localStorage.setItem('done_'+id,'1');
    msg('제출되었습니다. 참여해 주셔서 감사합니다.');
  }catch(e){$('#go').disabled=false;alert('제출하지 못했습니다. 설문이 마감되었거나 네트워크에 문제가 있습니다.')}
}
</script>
</body>
</html>
